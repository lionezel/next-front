<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Next Financial Auto-Fill</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .logo {
      width: 34px;
      height: 34px;
      background: #2563eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .box {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 12px;
      margin-bottom: 8px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-amber {
      background: #f59e0b;
      color: #0f172a;
      margin-top: 8px;
    }
    .btn-amber:hover {
      background: #d97706;
    }
    .status {
      font-size: 11px;
      color: #10b981;
      text-align: center;
      margin-top: 8px;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">Next Financial Auto-Fill</div>
      <div class="subtitle">Autollenado para Bancos</div>
    </div>
  </div>

  <div class="box">
    <label>Pegar Ficha o JSON del Cliente</label>
    <textarea id="clientJson" rows="4" placeholder="Pega aquí la ficha copiada desde next-admin..."></textarea>
    <button class="btn" id="btnSave">Guardar Cliente Activo</button>
  </div>

  <button class="btn btn-amber" id="btnFill">⚡ Autollenar Formulario en esta Pestaña</button>
  <div class="status" id="statusMsg">¡Formulario completado con éxito!</div>

  <script src="popup.js"></script>
</body>
</html>
